name: Build Image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # A release tag publishes under its own name. A branch dispatch is a deploy build
  # rather than a release: branch names may contain characters an OCI tag rejects, so
  # it publishes under its commit and never claims :latest.
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('branch-{0}', github.sha) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release tag is immutable work: a later tag must not cancel it midway.
  cancel-in-progress: false

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            # A branch dispatch builds a deployable image without cutting a release,
            # so the version rules below — which only govern release tags — do not
            # apply. Everything after this job still runs the full test suite.
            echo "Branch build $IMAGE_TAG; skipping release version validation"
            exit 0
          fi
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IMAGE_TAG must be a stable vMAJOR.MINOR.PATCH version tag" >&2
            exit 1
          fi
          root_version=$(jq -r .version package.json)
          web_version=$(jq -r .version web/package.json)
          if [[ "$root_version" != "$web_version" ]]; then
            echo "Root package version $root_version does not match web package version $web_version" >&2
            exit 1
          fi
          if [[ "$IMAGE_TAG" != "v$root_version" ]]; then
            echo "Tag $IMAGE_TAG does not match package version v$root_version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.mod
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev
      - run: npm --prefix web audit
      - run: shellcheck scripts/e2e-server.sh scripts/package-agent.sh scripts/smoke-compose.sh receiver/readsb/install.sh
      - run: docker compose config --quiet
        env:
          SKYTRACE_IMAGE: ghcr.io/example/skytrace@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SKYTRACE_ENV_FILE: /dev/null
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm run test:coverage
      - run: npm run test:e2e

  docker-compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.mod
      - run: scripts/smoke-compose.sh docker

  podman-compose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.mod
      - name: Install the native Podman Compose provider
        run: |
          python3 -m venv "$RUNNER_TEMP/podman-compose"
          "$RUNNER_TEMP/podman-compose/bin/pip" install podman-compose==1.6.0
          "$RUNNER_TEMP/podman-compose/bin/podman-compose" version
      - name: Exercise the Compose contract on rootless Podman
        env:
          CONTAINERS_CONF: ${{ runner.temp }}/podman-containers.conf
          PODMAN_COMPOSE_PROVIDER: ${{ runner.temp }}/podman-compose/bin/podman-compose
        run: |
          printf '[engine]\nruntime = "runc"\n' > "$CONTAINERS_CONF"
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          test "$(podman info --format '{{.Host.OCIRuntime.Name}}')" = runc
          scripts/smoke-compose.sh podman

  agent-build:
    # Receiver assets exist to be attached to a release, so a branch deploy build
    # skips them (and, through `needs`, agent-assets and release with them).
    if: github.ref_type == 'tag'
    needs: release-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            execute: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            execute: true
          - target: linux-armv6
            runner: ubuntu-24.04
            execute: false
          - target: linux-armv7
            runner: ubuntu-24.04
            execute: false
          - target: linux-riscv64
            runner: ubuntu-24.04
            execute: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.mod
      - name: Build and inspect the receiver target
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/agents"
          extract="$RUNNER_TEMP/extracted"
          mkdir -p "$output" "$extract"
          target="${{ matrix.target }}"
          scripts/package-agent.sh "$IMAGE_TAG" "$target" "$output"
          archive="$output/skytrace-agent-$IMAGE_TAG-$target.tar.gz"
          tar -C "$extract" -xzf "$archive"
          binary="$extract/skytrace-agent-$IMAGE_TAG-$target/bin/skytrace-agent"
          go version -m "$binary"
      - name: Execute the native receiver target
        if: matrix.execute
        shell: bash
        run: |
          binary="$RUNNER_TEMP/extracted/skytrace-agent-$IMAGE_TAG-${{ matrix.target }}/bin/skytrace-agent"
          "$binary" --version | grep -Fx "skytrace-agent $IMAGE_TAG"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: receiver-agent-${{ matrix.target }}
          path: ${{ runner.temp }}/agents/skytrace-agent-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  agent-assets:
    needs: agent-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: receiver-agent-*
          path: ${{ runner.temp }}/agents
          merge-multiple: true
      - name: Verify receiver release assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/agents"
          for target in \
            linux-armv6 \
            linux-armv7 \
            linux-arm64 \
            linux-amd64 \
            linux-riscv64
          do
            test -f "skytrace-agent-$IMAGE_TAG-$target.tar.gz"
          done
          test "$(find . -maxdepth 1 -name 'skytrace-agent-*.tar.gz' | wc -l)" -eq 5
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: receiver-agents
          path: ${{ runner.temp }}/agents/skytrace-agent-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [release-test, docker-compose-test, podman-compose-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    # Build each architecture natively; the manifest job publishes versioned and latest indexes.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,scope=${{ matrix.artifact }},mode=min,ignore-error=true
      - name: Export image digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: image-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish the multi-platform manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do
            refs+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          if [[ "${#refs[@]}" -ne 2 ]]; then
            echo "Expected two platform image digests, found ${#refs[@]}" >&2
            exit 1
          fi
          tags=(--tag "${REGISTRY_IMAGE}:${IMAGE_TAG}")
          # Only a release owns :latest. A branch build must never move it, or an
          # unreleased commit would be what anything tracking :latest pulls next.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tags+=(--tag "${REGISTRY_IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            --metadata-file "$RUNNER_TEMP/manifest-metadata.json" \
            "${refs[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest // empty' \
            "$RUNNER_TEMP/manifest-metadata.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid multi-platform manifest digest: $digest" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${REGISTRY_IMAGE}@${digest}"
          # The deployment manifest pins a digest, so print the exact line to copy.
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${REGISTRY_IMAGE}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.ref_type == 'tag'
    needs: [manifest, agent-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: receiver-agents
          path: ${{ runner.temp }}/agents
      - name: Verify receiver release assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/agents"
          for target in \
            linux-armv6 \
            linux-armv7 \
            linux-arm64 \
            linux-amd64 \
            linux-riscv64
          do
            test -f "skytrace-agent-$IMAGE_TAG-$target.tar.gz"
          done
          test "$(find . -maxdepth 1 -name 'skytrace-agent-*.tar.gz' | wc -l)" -eq 5
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf -v release_notes '%s\n' \
            '## Server image' \
            '' \
            '```env' \
            "SKYTRACE_IMAGE=${REGISTRY_IMAGE}:${IMAGE_TAG}" \
            '```' \
            '' \
            '## Receiver agent' \
            '' \
            'Download the Linux archive matching the receiver CPU architecture.'
          if release_is_draft=$(gh release view "$IMAGE_TAG" \
            --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Published release $IMAGE_TAG already exists" >&2
              exit 1
            fi
          else
            gh release create "$IMAGE_TAG" \
              --draft \
              --verify-tag \
              --title "$IMAGE_TAG" \
              --generate-notes \
              --notes "$release_notes"
          fi
          gh release upload "$IMAGE_TAG" \
            "$RUNNER_TEMP/agents/skytrace-agent-${IMAGE_TAG}-linux-armv6.tar.gz" \
            "$RUNNER_TEMP/agents/skytrace-agent-${IMAGE_TAG}-linux-armv7.tar.gz" \
            "$RUNNER_TEMP/agents/skytrace-agent-${IMAGE_TAG}-linux-arm64.tar.gz" \
            "$RUNNER_TEMP/agents/skytrace-agent-${IMAGE_TAG}-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/agents/skytrace-agent-${IMAGE_TAG}-linux-riscv64.tar.gz" \
            --clobber
          gh release edit "$IMAGE_TAG" --draft=false
