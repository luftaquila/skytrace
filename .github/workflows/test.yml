name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev
      - run: npm --prefix web audit
      - run: shellcheck scripts/package-agent.sh scripts/smoke-compose.sh receiver/readsb/install.sh
      - run: docker compose config --quiet
        env:
          SKYTRACE_IMAGE: ghcr.io/example/skytrace@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SKYTRACE_ENV_FILE: .env.example
      - run: npm run check
